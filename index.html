<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Shisha Pejë</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0A0A0A; 
            color: white; 
            overflow-x: hidden; 
        }
        .font-cinzel { 
            font-family: 'Cinzel', serif; 
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- CONFIGURATION ---
        const TELEGRAM_BOT_TOKEN = '8776970813:AAFRL80-ievAXX-g7nGoaCI7uLiLjCIuwFQ';
        const TELEGRAM_CHAT_ID = '-1003530698471';

        const PRODUCTS = [
            { id: 1, name: "Standard Shisha", desc: "1 Shisha, 1 Shije, 3 Gaca", price: 7, icon: "Wind" },
            { id: 2, name: "Premium Pack", desc: "100g Shije, 5x Ndezje", price: 20, icon: "Package" },
            { id: 3, name: "Luxury Pack", desc: "200g Shije, 10x Ndezje", price: 30, icon: "Gem" },
            { id: 4, name: "Elite Pack", desc: "450g Shije, 25x Ndezje", price: 60, icon: "Crown" }
        ];

        const LOCATIONS = [
            "Peja (Transporti pa pagese)", "Loxhe (Transporti 3 euro)", "Qyshk (Transporti 3 euro)",
            "Graboc (Transporti 3 euro)", "Raushiq (Transporti 3 euro)", "Vitomeric (Transporti 3 euro)",
            "Pavlan (Transporti 3 euro)", "Zahaq (Transporti 3 euro)", "Katund i Ri (Transporti 3 euro)",
            "Zllapek (Transporti 3 euro)"
        ];

        // Rregulluar: Metoda më e sigurt për Ikonat Lucide në React pa npm
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconObj = lucide.icons[name];
            if (!iconObj) return null;
            const svgMarkup = iconObj.toSvg({ width: size, height: size, class: className });
            return <span className={`inline-flex ${className}`} dangerouslySetInnerHTML={{ __html: svgMarkup }} />;
        };

        function App() {
            const [step, setStep] = useState('home');
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [orderData, setOrderData] = useState({ name: '', phone: '', location: '', coords: null });
            const [timeLeft, setTimeLeft] = useState(null);
            const [isSending, setIsSending] = useState(false);
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [tempCode, setTempCode] = useState('');
            const [allOrders, setAllOrders] = useState(() => {
                const saved = localStorage.getItem('all_shisha_orders');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => {
                const savedOrder = localStorage.getItem('shisha_order');
                if (savedOrder) {
                    const { expiry, data, product } = JSON.parse(savedOrder);
                    const now = Date.now();
                    if (now < expiry) {
                        setOrderData(data); 
                        setSelectedProduct(product); 
                        setStep('timer');
                        setTimeLeft(Math.floor((expiry - now) / 1000));
                    }
                }
            }, []);

            useEffect(() => {
                if (timeLeft === null || timeLeft <= 0) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) { 
                            clearInterval(timer); 
                            localStorage.removeItem('shisha_order'); 
                            setStep('home'); 
                            return 0; 
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [timeLeft]);

            const handleLocation = () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((pos) => {
                        setOrderData(prev => ({ ...prev, coords: { lat: pos.coords.latitude, lng: pos.coords.longitude } }));
                        alert("Lokacioni u ruajt! ✅");
                    }, () => alert("Ju lutem ndizni GPS-in ose lejoni qasjen e shfletuesit te lokacioni."));
                } else {
                    alert("Shfletuesi juaj nuk e mbështet gjetjen e lokacionit.");
                }
            };

            const sendToTelegram = async () => {
                if(!orderData.name || !orderData.phone || !orderData.location) {
                    alert("Ju lutem plotësoni të gjitha të dhënat (Emrin, Telefonin dhe Lokacionin).");
                    return;
                }

                setIsSending(true);
                const transportPrice = orderData.location.includes('pa pagese') ? '0€' : '3€';
                
                // Rregulluar: URL e Google Maps dhe interpolimi i stringut
                const mapsLink = orderData.coords 
                    ? `\n🗺️ <a href="https://www.google.com/maps?q=${orderData.coords.lat},${orderData.coords.lng}">Hape në Maps</a>` 
                    : '';
                    
                const message = `<b>🚀 POROSI E RE SHISHA 🚀</b>\n👤 <b>Klienti:</b> ${orderData.name}\n📞 <b>Tel:</b> ${orderData.phone}\n📦 <b>Produkti:</b> ${selectedProduct.name}\n🚚 <b>Transporti:</b> ${transportPrice}${mapsLink}`;

                const newOrder = { id: Date.now(), product: selectedProduct, data: orderData, timestamp: new Date().toLocaleString() };
                const updated = [newOrder, ...allOrders];
                localStorage.setItem('all_shisha_orders', JSON.stringify(updated));
                setAllOrders(updated);
                localStorage.setItem('shisha_order', JSON.stringify({ expiry: Date.now() + (30 * 60 * 1000), data: orderData, product: selectedProduct }));

                setStep('timer'); 
                setTimeLeft(30 * 60);
                
                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'HTML' })
                    });
                } catch (e) {
                    console.error("Gabim në dërgimin e mesazhit:", e);
                } finally { 
                    setIsSending(false); 
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <AnimatePresence mode="wait">
                        {step === 'home' && (
                            <motion.div key="home" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="text-center space-y-8">
                                <img src="https://images.unsplash.com/photo-1527030280862-64139fba04ca?q=80&w=500" alt="Shisha" className="w-48 h-48 rounded-full border-4 border-[#D4AF37] mx-auto animate-float object-cover shadow-[0_0_30px_rgba(212,175,55,0.3)]" />
                                <h1 className="text-5xl font-cinzel font-bold text-[#D4AF37]">LUXURY SHISHA</h1>
                                <button onClick={() => setStep('selection')} className="bg-[#D4AF37] text-black font-bold py-4 px-12 rounded-full text-xl uppercase hover:bg-yellow-500 transition-colors">Porosit Tani</button>
                                <button onClick={() => setShowAdminModal(true)} className="block mx-auto text-zinc-600 hover:text-zinc-400 text-xs uppercase tracking-widest transition-colors">Paneli i Porosive</button>
                            </motion.div>
                        )}

                        {step === 'selection' && (
                            <motion.div key="selection" initial={{ x: 100, opacity: 0 }} animate={{ x: 0, opacity: 1 }} exit={{ x: -100, opacity: 0 }} className="w-full max-w-2xl space-y-6">
                                <h2 className="text-3xl font-cinzel text-center text-[#D4AF37]">ZGJIDHNI PRODUKTIN</h2>
                                <div className="grid gap-4">
                                    {PRODUCTS.map(p => (
                                        <div key={p.id} onClick={() => { setSelectedProduct(p); setStep('details'); }} className="bg-white/5 border border-white/10 p-6 rounded-2xl flex justify-between items-center cursor-pointer hover:border-[#D4AF37] hover:bg-white/10 transition-all">
                                            <div className="flex items-center gap-4">
                                                <Icon name={p.icon} className="text-[#D4AF37]" />
                                                <div>
                                                    <h3 className="font-bold text-lg">{p.name}</h3>
                                                    <p className="text-sm text-zinc-400">{p.desc}</p>
                                                </div>
                                            </div>
                                            <span className="text-xl font-bold text-[#D4AF37]">{p.price}€</span>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setStep('home')} className="block mx-auto text-zinc-500 hover:text-white transition-colors">Kthehu</button>
                            </motion.div>
                        )}

                        {step === 'details' && (
                            <motion.div key="details" initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.9, opacity: 0 }} className="w-full max-w-md bg-white/5 p-8 rounded-3xl space-y-6 border border-white/10">
                                <h2 className="text-2xl font-cinzel text-center text-[#D4AF37]">DETAJET E POROSISË</h2>
                                <input type="text" placeholder="Emri dhe Mbiemri" className="w-full bg-black/50 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-[#D4AF37] transition-colors" onChange={e => setOrderData({...orderData, name: e.target.value})} />
                                <input type="tel" placeholder="+383 4X XXX XXX" className="w-full bg-black/50 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-[#D4AF37] transition-colors" onChange={e => setOrderData({...orderData, phone: e.target.value})} />
                                <select className="w-full bg-black/50 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-[#D4AF37] transition-colors text-white" onChange={e => setOrderData({...orderData, location: e.target.value})}>
                                    <option value="" className="text-black">Zgjidhni lokacionin...</option>
                                    {LOCATIONS.map(l => <option key={l} value={l} className="text-black">{l}</option>)}
                                </select>
                                <button onClick={handleLocation} className="w-full py-4 border border-[#D4AF37]/50 text-[#D4AF37] hover:bg-[#D4AF37]/10 rounded-xl font-bold transition-colors flex items-center justify-center gap-2">
                                    <Icon name="MapPin" size={20} />
                                    {orderData.coords ? "LOKACIONI U RUAJT ✓" : "VENDOS LOKACIONIN (GPS)"}
                                </button>
                                <button onClick={sendToTelegram} disabled={isSending} className="w-full py-5 bg-[#D4AF37] text-black font-bold rounded-xl uppercase hover:bg-yellow-500 disabled:opacity-50 transition-colors">
                                    {isSending ? "Duke dërguar..." : "Konfirmo Porosinë"}
                                </button>
                                <button onClick={() => setStep('selection')} className="block mx-auto w-full text-center text-zinc-500 hover:text-white mt-4">Kthehu</button>
                            </motion.div>
                        )}

                        {step === 'timer' && (
                            <motion.div key="timer" initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="text-center space-y-8 bg-white/5 p-12 rounded-3xl border border-[#D4AF37]/30">
                                <h2 className="text-3xl font-cinzel text-[#D4AF37]">POROSIA U NIS! 🚚</h2>
                                <p className="text-zinc-400 max-w-xs mx-auto">Porosia juaj është pranuar dhe është nisur drejt jush. Koha e parashikuar e mbërritjes:</p>
                                <div className="text-7xl font-bold text-white tracking-wider tabular-nums">
                                    {Math.floor(timeLeft/60)}:{String(timeLeft%60).padStart(2,'0')}
                                </div>
                                <button onClick={() => { localStorage.removeItem('shisha_order'); setStep('home'); }} className="text-red-400/80 hover:text-red-500 uppercase text-sm font-bold mt-8 transition-colors">
                                    Anulo / Fillo Porosi të Re
                                </button>
                            </motion.div>
                        )}

                        {step === 'admin' && (
                            <motion.div key="admin" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="w-full max-w-4xl space-y-6">
                                <div className="flex justify-between items-center bg-white/5 p-6 rounded-2xl border border-[#D4AF37]/30">
                                    <div className="flex items-center gap-3">
                                        <Icon name="Shield" className="text-[#D4AF37]" />
                                        <h2 className="text-2xl font-cinzel text-[#D4AF37] font-bold">PANELI I POROSIVE</h2>
                                    </div>
                                    <button onClick={() => setStep('home')} className="text-zinc-400 hover:text-white py-2 px-4 rounded-lg bg-black/50">Mbyll Panelin</button>
                                </div>
                                <div className="grid gap-4">
                                    {allOrders.length === 0 ? (
                                        <div className="text-center p-12 bg-white/5 rounded-2xl border border-white/10">
                                            <Icon name="Inbox" size={48} className="mx-auto text-zinc-600 mb-4" />
                                            <p className="text-zinc-400">Nuk keni asnjë porosi të regjistruar ende.</p>
                                        </div>
                                    ) : allOrders.map(o => (
                                        <div key={o.id} className="bg-white/5 border border-white/10 p-5 rounded-xl flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 hover:border-[#D4AF37]/50 transition-colors">
                                            <div>
                                                <p className="text-[11px] text-[#D4AF37] mb-1 font-mono">{o.timestamp}</p>
                                                <p className="font-bold text-lg">{o.data.name} <span className="text-sm font-normal text-zinc-400 ml-2">({o.product?.name})</span></p>
                                                <p className="text-sm text-zinc-400 mt-1 flex items-center gap-2"><Icon name="Phone" size={14}/> {o.data.phone}</p>
                                                <p className="text-sm text-zinc-400 flex items-center gap-2 mt-1"><Icon name="Navigation" size={14}/> {o.data.location}</p>
                                            </div>
                                            <div className="flex gap-2">
                                                {o.data.coords && (
                                                    <a href={`https://www.google.com/maps?q=${o.data.coords.lat},${o.data.coords.lng}`} target="_blank" rel="noreferrer" className="flex items-center gap-2 px-4 py-3 bg-[#D4AF37]/10 hover:bg-[#D4AF37]/20 text-[#D4AF37] rounded-lg transition-colors font-semibold text-sm">
                                                        <Icon name="MapPin" size={18} />
                                                        Hap në Maps
                                                    </a>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                            <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="bg-zinc-900 border border-[#D4AF37]/30 p-8 rounded-3xl w-full max-w-xs space-y-6">
                                <h3 className="text-center font-bold text-[#D4AF37] flex items-center justify-center gap-2"><Icon name="Lock" size={20}/> KODI I QASJES</h3>
                                <input type="password" autoFocus className="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-center text-2xl tracking-widest focus:outline-none focus:border-[#D4AF37]" onChange={e => setTempCode(e.target.value)} onKeyDown={(e) => {
                                    if(e.key === 'Enter') {
                                        if(tempCode === '0391001000') { setStep('admin'); setShowAdminModal(false); } else alert("Kodi i gabuar!");
                                    }
                                }}/>
                                <button onClick={() => { if(tempCode === '0391001000') { setStep('admin'); setShowAdminModal(false); } else alert("Kodi i gabuar!"); }} className="w-full py-4 bg-[#D4AF37] hover:bg-yellow-500 text-black font-bold rounded-xl transition-colors">HYR NË PANEL</button>
                                <button onClick={() => setShowAdminModal(false)} className="w-full text-zinc-500 hover:text-white transition-colors">Anulo</button>
                            </motion.div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
