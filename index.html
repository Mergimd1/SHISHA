<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Shisha Pejë</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0A; color: white; overflow-x: hidden; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- KONFIGURIMI ---
        const TELEGRAM_BOT_TOKEN = '8776970813:AAFRL80-ievAXX-g7nGoaCI7uLiLjCIuwFQ';
        const TELEGRAM_CHAT_ID = '-1003530698471';
        const ADMIN_CODE = '0391001000';

        const PRODUCTS = [
            { id: 1, name: "Standard Shisha", desc: "1 Shisha, 1 Shije, 3 Gaca", price: 7, icon: "Wind" },
            { id: 2, name: "Premium Pack", desc: "100g Shije, 5x Ndezje", price: 20, icon: "Package" },
            { id: 3, name: "Luxury Pack", desc: "200g Shije, 10x Ndezje", price: 30, icon: "Gem" },
            { id: 4, name: "Elite Pack", desc: "450g Shije, 25x Ndezje", price: 60, icon: "Crown" }
        ];

        const LOCATIONS = [
            "Peja (Transporti pa pagese)", "Loxhe (3€)", "Qyshk (3€)", "Graboc (3€)", 
            "Raushiq (3€)", "Vitomeric (3€)", "Pavlan (3€)", "Zahaq (3€)", 
            "Katund i Ri (3€)", "Zllapek (3€)"
        ];

        const Icon = ({ name, size = 24, className = "" }) => {
            const [svg, setSvg] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    setSvg(window.lucide.icons[name].toSvg({ width: size, height: size, class: className }));
                }
            }, [name]);
            return <span dangerouslySetInnerHTML={{ __html: svg }} />;
        };

        function App() {
            const [step, setStep] = useState('home');
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [orderData, setOrderData] = useState({ name: '', phone: '', location: '', coords: null });
            const [timeLeft, setTimeLeft] = useState(null);
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [tempCode, setTempCode] = useState('');
            const [allOrders, setAllOrders] = useState(() => JSON.parse(localStorage.getItem('all_shisha_orders') || '[]'));

            // Kontrolli i timerit në nisje
            useEffect(() => {
                const saved = localStorage.getItem('shisha_order');
                if (saved) {
                    const { expiry, data, product } = JSON.parse(saved);
                    const now = Date.now();
                    if (now < expiry) {
                        setOrderData(data); setSelectedProduct(product); setStep('timer');
                        setTimeLeft(Math.floor((expiry - now) / 1000));
                    }
                }
            }, []);

            useEffect(() => {
                if (!timeLeft || timeLeft <= 0) return;
                const t = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                return () => clearInterval(t);
            }, [timeLeft]);

            const handleOrder = async () => {
                if (!orderData.name || !orderData.phone || !orderData.location) return alert("Plotësoni të gjitha fushat!");
                
                const mapsUrl = orderData.coords ? `https://www.google.com/maps?q=${orderData.coords.lat},${orderData.coords.lng}` : 'Nuk ka GPS';
                const msg = `🚀 POROSI E RE\n👤: ${orderData.name}\n📞: ${orderData.phone}\n📦: ${selectedProduct.name}\n📍: ${orderData.location}\n🗺️: ${mapsUrl}`;

                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg })
                    });
                    
                    const newOrder = { id: Date.now(), product: selectedProduct, data: orderData, timestamp: new Date().toLocaleString() };
                    const updated = [newOrder, ...allOrders];
                    setAllOrders(updated);
                    localStorage.setItem('all_shisha_orders', JSON.stringify(updated));
                    localStorage.setItem('shisha_order', JSON.stringify({ expiry: Date.now() + 1800000, data: orderData, product: selectedProduct }));
                    
                    setStep('timer'); setTimeLeft(1800);
                } catch (e) { alert("Gabim në dërgim!"); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-[#0A0A0A]">
                    <AnimatePresence mode="wait">
                        {step === 'home' && (
                            <motion.div key="h" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="text-center">
                                <img src="https://images.unsplash.com/photo-1527030280862-64139fba04ca?q=80&w=500" className="w-48 h-48 rounded-full border-4 border-[#D4AF37] mx-auto animate-float object-cover shadow-[0_0_50px_rgba(212,175,55,0.2)]" />
                                <h1 className="text-5xl font-cinzel font-bold text-[#D4AF37] my-8 tracking-widest">LUXURY SHISHA</h1>
                                <button onClick={() => setStep('selection')} className="bg-[#D4AF37] text-black font-bold py-4 px-12 rounded-full text-xl uppercase hover:scale-105 transition-transform">Porosit Tani</button>
                                <button onClick={() => setShowAdminModal(true)} className="block mx-auto mt-10 text-zinc-700 text-xs tracking-[0.3em]">ADMIN PANEL</button>
                            </motion.div>
                        )}

                        {step === 'selection' && (
                            <motion.div key="s" initial={{ x: 50, opacity: 0 }} animate={{ x: 0, opacity: 1 }} className="w-full max-w-md space-y-4">
                                <h2 className="text-2xl font-cinzel text-center text-[#D4AF37] mb-6">ZGJIDHNI PRODUKTIN</h2>
                                {PRODUCTS.map(p => (
                                    <div key={p.id} onClick={() => { setSelectedProduct(p); setStep('details'); }} className="glass p-5 rounded-2xl flex justify-between items-center cursor-pointer hover:border-[#D4AF37] transition-all">
                                        <div className="flex items-center gap-4">
                                            <Icon name={p.icon} className="text-[#D4AF37]" />
                                            <div><h3 className="font-bold">{p.name}</h3><p className="text-xs text-zinc-500">{p.desc}</p></div>
                                        </div>
                                        <span className="text-xl font-bold text-[#D4AF37]">{p.price}€</span>
                                    </div>
                                ))}
                                <button onClick={() => setStep('home')} className="w-full text-zinc-500 pt-4">Kthehu</button>
                            </motion.div>
                        )}

                        {step === 'details' && (
                            <motion.div key="d" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="glass p-8 rounded-3xl w-full max-w-md space-y-4">
                                <h2 className="text-xl font-cinzel text-center text-[#D4AF37]">DETAJET E POROSISË</h2>
                                <input type="text" placeholder="Emri Mbiemri" className="w-full bg-black/50 border border-white/10 p-4 rounded-xl outline-none focus:border-[#D4AF37]" onChange={e => setOrderData({...orderData, name: e.target.value})} />
                                <input type="tel" placeholder="Nr. Telefonit" className="w-full bg-black/50 border border-white/10 p-4 rounded-xl outline-none focus:border-[#D4AF37]" onChange={e => setOrderData({...orderData, phone: e.target.value})} />
                                <select className="w-full bg-black/50 border border-white/10 p-4 rounded-xl outline-none" onChange={e => setOrderData({...orderData, location: e.target.value})}>
                                    <option value="">Zgjidh lokacionin...</option>
                                    {LOCATIONS.map(l => <option key={l} value={l}>{l}</option>)}
                                </select>
                                <button onClick={() => navigator.geolocation.getCurrentPosition(p => { setOrderData({...orderData, coords: {lat: p.coords.latitude, lng: p.coords.longitude}}); alert("GPS OK! ✅"); })} className="w-full py-3 border border-[#D4AF37]/20 text-[#D4AF37] rounded-xl text-sm font-bold">
                                    {orderData.coords ? "LOKACIONI U RUAJT ✓" : "DËRGO LOKACIONIN (GPS)"}
                                </button>
                                <button onClick={handleOrder} className="w-full py-5 bg-[#D4AF37] text-black font-bold rounded-xl uppercase shadow-lg shadow-[#D4AF37]/20">Konfirmo</button>
                                <button onClick={() => setStep('selection')} className="w-full text-zinc-500 text-sm">Mbrapa</button>
                            </motion.div>
                        )}

                        {step === 'timer' && (
                            <motion.div key="t" className="text-center space-y-6">
                                <div className="text-8xl font-bold text-[#D4AF37] tabular-nums">{Math.floor(timeLeft/60)}:{String(timeLeft%60).padStart(2,'0')}</div>
                                <h2 className="text-2xl font-cinzel">POROSIA RRUGËS! 🚚</h2>
                                <button onClick={() => { localStorage.removeItem('shisha_order'); setStep('home'); }} className="text-red-500 text-xs font-bold uppercase tracking-widest pt-10">Anulo / Porosi e re</button>
                            </motion.div>
                        )}

                        {step === 'admin' && (
                            <motion.div key="a" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="w-full max-w-2xl space-y-4">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-cinzel text-[#D4AF37]">POROSITË</h2>
                                    <button onClick={() => setStep('home')} className="text-zinc-500">Mbyll</button>
                                </div>
                                {allOrders.map(o => (
                                    <div key={o.id} className="glass p-4 rounded-xl flex justify-between items-center">
                                        <div>
                                            <p className="text-[10px] text-[#D4AF37]">{o.timestamp}</p>
                                            <p className="font-bold">{o.data.name} - {o.product.name}</p>
                                            <p className="text-xs text-zinc-400">{o.data.phone} | {o.data.location}</p>
                                        </div>
                                        {o.data.coords && <a href={`https://www.google.com/maps?q=${o.data.coords.lat},${o.data.coords.lng}`} target="_blank" className="p-3 bg-[#D4AF37] text-black rounded-lg"><Icon name="MapPin" size={18}/></a>}
                                    </div>
                                ))}
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {showAdminModal && (
                        <div className="fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-50">
                            <div className="glass p-8 rounded-3xl w-full max-w-xs space-y-6 text-center">
                                <h3 className="font-bold text-[#D4AF37] tracking-widest uppercase">Kodi</h3>
                                <input type="password" autoFocus className="w-full bg-black border border-white/10 p-4 rounded-xl text-center text-2xl tracking-[0.5em] outline-none" onChange={e => setTempCode(e.target.value)} />
                                <button onClick={() => { if(tempCode === ADMIN_CODE) { setStep('admin'); setShowAdminModal(false); } else alert("Gabim!"); }} className="w-full py-4 bg-[#D4AF37] text-black font-bold rounded-xl">HYR</button>
                                <button onClick={() => setShowAdminModal(false)} className="text-zinc-500">Anulo</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
